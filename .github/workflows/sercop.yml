name: Actualizar SERCOP (equipo del GADMR)

# SERCOP no responde a los servidores de GitHub; este flujo corre en un equipo dentro de Ecuador
# registrado como runner propio con la etiqueta "sercop" (ver README, sección "Runner SERCOP").
# Corre 10 minutos antes de la actualización general para que esta tome los estados frescos.

on:
  schedule:
    - cron: '50 12 * * *'   # 07:50 Ecuador
    - cron: '50 18 * * *'   # 13:50 Ecuador
    - cron: '50 23 * * *'   # 18:50 Ecuador
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sercop
  cancel-in-progress: false

jobs:
  sercop:
    runs-on: [self-hosted, sercop]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python y Playwright
        shell: pwsh
        run: |
          python -m pip install --quiet -r requirements.txt
          python -m playwright install chromium

      - name: Leer fichas SERCOP
        id: sercop
        continue-on-error: true
        shell: pwsh
        run: |
          python -u scripts/extraer_sercop.py 2>&1 | Tee-Object -FilePath data/registro_sercop.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Armar datos y guardar
        if: always()
        shell: pwsh
        run: |
          python scripts/armar_datos.py
          $hora = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId((Get-Date), 'SA Pacific Standard Time').ToString('yyyy-MM-dd HH:mm')
          "Corrida SERCOP $hora · ${{ steps.sercop.outcome }}" | Out-File -Encoding utf8 data/ultima_corrida_sercop.txt
          git config user.name  "actualizador-contratacion"
          git config user.email "actions@users.noreply.github.com"
          git add datos_contratacion.json data/
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { "Sin cambios"; exit 0 }
          git commit -m "SERCOP $hora"
          git pull --rebase -X theirs
          git push
