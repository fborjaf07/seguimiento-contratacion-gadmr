name: Actualizar seguimiento de contratación

on:
  schedule:
    - cron: '0 13 * * *'   # 08:00 Ecuador
    - cron: '0 19 * * *'   # 14:00 Ecuador
    - cron: '0 0 * * *'    # 19:00 Ecuador
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Playwright
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Extraer e-DOC (revisión y aprobación)
        id: edoc
        continue-on-error: true
        timeout-minutes: 15
        env:
          EDOC_USUARIO:    ${{ secrets.EDOC_USUARIO }}
          EDOC_CONTRASENA: ${{ secrets.EDOC_CONTRASENA }}
        run: |
          mkdir -p data
          set -o pipefail
          python -u scripts/extraer_edoc.py 2>&1 | tee data/registro_edoc.txt

      - name: Extraer SERCOP (fichas de proceso)
        id: sercop
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -o pipefail
          python -u scripts/extraer_sercop.py 2>&1 | tee data/registro_sercop.txt

      - name: Armar datos del tablero
        if: always()
        run: |
          python scripts/armar_datos.py
          node scripts/cambios.js

      - name: Guardar en el repositorio
        if: always()
        run: |
          echo "Corrida $(TZ=America/Guayaquil date '+%Y-%m-%d %H:%M') · e-DOC: ${{ steps.edoc.outcome }} · SERCOP: ${{ steps.sercop.outcome }}" > data/ultima_corrida.txt
          git config user.name  "actualizador-contratacion"
          git config user.email "actions@users.noreply.github.com"
          git add datos_contratacion.json data/ sercop_procesos.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Actualización $(TZ=America/Guayaquil date '+%Y-%m-%d %H:%M')"
          git push

      - name: Resumen
        if: always()
        run: |
          echo "e-DOC: ${{ steps.edoc.outcome }}  ·  SERCOP: ${{ steps.sercop.outcome }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.edoc.outcome }}" != "success" ]; then echo "::warning::El e-DOC no se pudo leer; el tablero conserva los datos anteriores. Revise los secretos EDOC_USUARIO y EDOC_CONTRASENA."; fi
          if [ "${{ steps.sercop.outcome }}" != "success" ]; then echo "::warning::SERCOP no se pudo leer; el tablero conserva los estados anteriores."; fi
